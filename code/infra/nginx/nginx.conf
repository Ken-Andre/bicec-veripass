worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout  65;
    port_in_redirect off;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=1r/s;

    # ============================================
    # HTTP → HTTPS Redirect (port 8080)
    # ============================================
    server {
        listen 8080 default_server;
        listen [::]:8080 default_server;
        server_name localhost;

        # Redirect all HTTP to HTTPS (on standard 443 host port)
        return 301 https://$host$request_uri;
    }

    # ============================================
    # HTTPS Server (port 8443) — TLS 1.3 + Security Headers
    # ============================================
    server {
        listen 8443 ssl default_server;
        listen [::]:8443 ssl default_server;
        server_name localhost;

        # --- TLS Configuration (Issue #44 + #176) ---
        # Certs generated by entrypoint.sh in /etc/nginx/ssl (outside read-only mount)
        ssl_certificate     /etc/ssl/certs/nginx-selfsigned.crt;
        ssl_certificate_key /etc/ssl/certs/nginx-selfsigned.key;

        
        # Désactiver TLS 1.0 et 1.1 (Issue #176)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers on;

        # --- Security Headers (Issue #176) ---
        # Common headers from security_headers.conf (CSP defined explicitly below)
        include /etc/nginx/security_headers.conf;
        # Content-Security-Policy (without 'unsafe-eval')
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: blob: https://fastapi.tiangolo.com; connect-src 'self' https://localhost wss://localhost; font-src 'self' https://r2cdn.perplexity.ai;" always;

        # Handle legacy /backoffice/ alias (preserve path)
        location ~ ^/backoffice/(?<path>.*)$ {
            return 301 /back-office/$path;
        }

        # --- Base Redirects ---
        location = / {
            return 302 /mobile/;
        }

        # --- Non-slash redirects ---
        location = /mobile {
            return 302 /mobile/;
        }
        location = /back-office {
            return 302 /back-office/;
        }

        # --- Mobile PWA (/mobile) ---
        location /mobile/ {
            proxy_pass http://pwa:8080/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_cache_bypass $http_upgrade;
        }


        location /back-office/ {
            proxy_pass http://backoffice:8080/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_cache_bypass $http_upgrade;
        }

        # --- FastAPI Backend API ---
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://api:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # --- Auth endpoints ---
        location /api/v1/auth/ {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://api:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # --- Health check endpoint (proxied to backend API) ---
        location /health {
            access_log off;
            
            # Proxy to backend API health endpoint
            proxy_pass http://api:8000/api/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            
            # Include common security headers (without CSP)
            include /etc/nginx/security_headers.conf;
            # Specific CSP for health endpoint (default-src 'none')
            add_header Content-Security-Policy "default-src 'none'" always;
        }
    }
}