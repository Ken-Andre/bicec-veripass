worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    log_format json_combined escape=json
        '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_addr":"$upstream_addr"'
        '}';

    access_log  /var/log/nginx/access.log json_combined;

    sendfile        on;
    keepalive_timeout  65;
    port_in_redirect off;

    # Upload size — images CNI jusqu'à 10MB
    client_max_body_size 12m;

    # Proxy timeouts — OCR GLM peut prendre jusqu'à 30s
    proxy_connect_timeout 30s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=1r/s;

    # ============================================
    # HTTP → HTTPS Redirect (port 8080)
    # ============================================
    server {
        listen 8080 default_server;
        listen [::]:8080 default_server;
        server_name localhost;

        # Redirect all HTTP to HTTPS (on standard 443 host port)
        return 301 https://$host$request_uri;
    }

    # ============================================
    # HTTPS Server (port 8443) — TLS 1.3 + Security Headers
    # ============================================
    server {
        listen 8443 ssl http2 default_server;
        listen [::]:8443 ssl http2 default_server;
        server_name localhost;

        # --- TLS Configuration (mkcert on local PC) ---
        # Certs generated by mkcert in /etc/nginx/ssl (read-only bind mount from host)
        # Falls back to self-signed if mkcert certs not available
        ssl_certificate     /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        # If mkcert cert files not found, uncomment below for fallback:
        # ssl_certificate     /etc/nginx/ssl/nginx-selfsigned.crt;
        # ssl_certificate_key /etc/nginx/ssl/nginx-selfsigned.key;

        
        # Désactiver TLS 1.0 et 1.1 (Issue #176)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers on;

        # --- Security Headers (Issue #176) ---
        # Common headers from security_headers.conf (CSP defined explicitly below)
        include /etc/nginx/security_headers.conf;
        # Content-Security-Policy (without 'unsafe-eval')
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: blob: https://fastapi.tiangolo.com; media-src 'self' blob:; worker-src 'self' blob:; connect-src 'self' blob: https://localhost wss://localhost https://*.sentry.io https://cdn.jsdelivr.net https://storage.googleapis.com; font-src 'self' https://r2cdn.perplexity.ai;" always;

        # Handle legacy /backoffice/ alias (preserve path)
        location ~ ^/backoffice/(?<path>.*)$ {
            return 301 /back-office/$path;
        }

        # --- Base Redirects ---
        location = / {
            return 302 /mobile/;
        }

        # --- Non-slash redirects ---
        location = /mobile {
            return 302 /mobile/;
        }
        location = /back-office {
            return 302 /back-office/;
        }

        # --- Mobile PWA (/mobile) ---
        location /mobile/ {
            proxy_pass http://pwa:8080/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_cache_bypass $http_upgrade;
            proxy_no_cache 1;
            proxy_cache off;
        }


        location /back-office/ {
            proxy_pass http://backoffice:8080/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_cache_bypass $http_upgrade;
        }

        # --- FastAPI Backend API ---
        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://api:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- Agent debug ingest (same-origin proxy to host) ---
        # Allows browser instrumentation without CSP/mixed-content issues.
        location = /__agent_debug_ingest {
            access_log off;
            proxy_pass http://host.docker.internal:7390/ingest/10600f78-494b-4d48-8769-7d90f5585c2d;
            proxy_set_header Host host.docker.internal;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # --- OCR endpoints: longer timeout for CPU-bound extraction ---
        # PaddleOCR predict() can take up to 180s on CPU; set 300s to be safe.
        location /api/v1/ocr/ {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://api:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 15s;
            proxy_send_timeout    120s;  # client upload time (image < 5s typically)
            proxy_read_timeout    300s;  # PaddleOCR predict() can take ~180s on CPU
        }

        # --- KYC capture endpoints: OCR pipeline can take >60s on CPU ---
        location /api/v1/kyc/capture/ {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://api:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 15s;
            proxy_send_timeout    120s;
            proxy_read_timeout    300s;
        }

        # --- KYC liveness endpoints: liveness + face match can be CPU-bound ---
        location /api/v1/kyc/liveness/ {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://api:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 15s;
            proxy_send_timeout    120s;
            proxy_read_timeout    300s;
        }

        # --- Auth endpoints ---
        location /api/v1/auth/ {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://api:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # --- Flower (Celery Monitoring) ---
        location /flower/ {
            proxy_pass http://flower:5555/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_cache_bypass $http_upgrade;
        }

        # --- Health check endpoint (proxied to backend API) ---
        location /health {
            access_log off;
            
            # Proxy to backend API health endpoint
            proxy_pass http://api:8000/api/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            
            # Include common security headers (without CSP)
            include /etc/nginx/security_headers.conf;
            # Specific CSP for health endpoint (default-src 'none')
            add_header Content-Security-Policy "default-src 'none'" always;
        }
    }
}
