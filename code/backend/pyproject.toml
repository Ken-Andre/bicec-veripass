[project]
name = "bicec-veripass-backend"
version = "0.1.0"
description = "Sovereign digital KYC onboarding platform for BICEC (Cameroon)"
license = "LicenseRef-BICEC-VeriPass-Proprietary"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.29",
    "pydantic-settings>=2.2",
    "pydantic[email]>=2.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "celery[redis]>=5.3",
    "flower>=2.0",
    "python-json-logger>=2.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "slowapi>=0.1.9",
    "cryptography>=42.0",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "aiosmtplib>=5.1.0",
    "aiofiles>=23.0",
    "pywebpush>=1.11.0",
    "sentry-sdk[fastapi]>=2.0",
    # OCR dependencies
    "paddleocr>=2.8",
    "paddlepaddle>=2.6",
    "opencv-python-headless>=4.9",
    "numpy>=1.24",
    "Pillow>=10.0",
    # Biometrics
    "deepface>=0.0.89",
    "onnxruntime>=1.18",
    "tf-keras>=2.16",  # Required by retinaface (DeepFace detector) with TensorFlow 2.16+
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "fakeredis>=2.21",
    "pytest-cov>=5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "fakeredis>=2.21",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py311"
