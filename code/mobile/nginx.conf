server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # HTML: toujours revalider pour permettre au SW de detecter les mises a jour
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri /index.html;
    }

    # Service Worker: jamais mis en cache (critique pour les mises a jour)
    location = /sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }

    # Manifest: revalider a chaque visite
    location = /manifest.json {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Assets avec hash (JS, CSS, images, fonts): cache agressif OK
    # Vite genere des noms de fichiers avec hash -> anciens bundles jamais re-references
    location ~* \.(js|css|png|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 404 /index.html;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
