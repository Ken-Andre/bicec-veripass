name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      contains(github.event.comment.body, ' /oc') ||
      startsWith(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, ' /opencode') ||
      startsWith(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: false
          fetch-depth: 0

      - name: Remove broken submodule from git state
        run: |
          git config --global --add safe.directory '*'
          
          # Force remove the bmad-builder entry from git's internal state
          git ls-files -s | grep bmad-builder && git rm --cached -f bmad-builder || true
          
          # Remove from git config
          git config --remove-section submodule.bmad-builder 2>/dev/null || true
          
          # Clean up the git modules directory
          rm -rf .git/modules/bmad-builder 2>/dev/null || true

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/big-pickle
